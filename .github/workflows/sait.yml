# Ehitab ja testib simulaatori ning avaldab veebilehe GitHub Pagesis.
# Tõmbetaotlustes ehitatakse ja testitakse, kuid ei avaldata.
name: Sait

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# tõmbetaotluses katkestab uus käivitus vana; harus main ei katkestata pooleli olevat avaldamist
concurrency:
  group: sait-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ehita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      - name: Kotlini testid (JVM ja Node) ning veebilehe moodul
        run: ./gradlew allTests jsBrowserProductionLibraryDistribution veebiandmed

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Veebilehe sõltuvused
        working-directory: web
        run: npm ci

      - name: Tüübikontroll, testid ja ehitamine
        working-directory: web
        run: |
          npm run check
          npm test
          npm run build

      - name: Brauseritest
        working-directory: web
        run: |
          npx playwright install --with-deps chromium
          npm run e2e

      - name: Otsingumootorite failid
        run: cp sitemap.xml robots.txt web/dist/

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  avalda:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: ehita
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.avaldamine.outputs.page_url }}
    steps:
      - id: avaldamine
        uses: actions/deploy-pages@v5
